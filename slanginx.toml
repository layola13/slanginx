# slanginx declarative configuration -- layer 1 of 2 (data layer).
# Edit and restart the server; no recompilation needed.
# Anything absent keeps the built-in default; a key with the wrong
# type is a startup error. Routing rules and ACLs are NOT here:
# they are the code layer, src/config.sla.

[server]
host = "127.0.0.1"
port = 18090
root = "www"
index = "index.html"
access_log = "logs/access.log"
max_file_bytes = 33554432
# Serve model (round 2): "dispatch" = the stage-2 dispatcher
# hands each request to a per-request goroutine; "merged" =
# a fixed set of long-lived workers accepts and serves directly
# (no per-request spawn). workers = the merged model's worker
# count (1..64, default 4); pair it with SA_TASK_CARRIERS >=
# workers + 4 in the launch environment. Defaults: dispatch, 4.
# serve_model = "merged"
# workers = 4

# Shared dict zones (M1, docs/HANDLER_MODEL.md model A): the only
# cross-request state in the server. Declared here, reached from
# the code layer only through the dict API. "stats" carries the
# reverse proxy's per-upstream counters, read back at
# GET /__slanginx/status.
[shared_dict.0]
name = "stats"
capacity = 1024

# Reverse proxy (M1): upstream pools and prefix routes. A route
# forwards the full normalized path to its pool, round-robin,
# with failover to the next server on transport errors.
# [upstream.0]
# name = "api"
# servers = "127.0.0.1:19001, 127.0.0.1:19002"
#
# [route.0]
# prefix = "/api/"
# upstream = "api"
